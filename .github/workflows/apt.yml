name: Publish signed Termux repository

on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
  pull_request:
    paths:
      - '.github/workflows/apt.yml'
      - 'apt/**'
      - 'setup-repo.sh'
      - 'scripts/*apt*'
      - 'tests/test-apt-repo.py'

permissions:
  contents: read

concurrency:
  group: herdr-apt-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg shellcheck
      - run: shellcheck setup-repo.sh scripts/test-apt-termux.sh
      - run: python3 -B tests/test-apt-repo.py

  repository:
    needs: checks
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ needs.checks.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.checks.outputs.commit }}
      - run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - name: Fetch published and checksum-verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/fetch-apt-packages.py build/apt-packages
      - name: Sign repository with dedicated key
        env:
          HERDR_APT_SIGNING_KEY: ${{ secrets.HERDR_APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/herdr-signing.XXXXXXXX")
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent; rm -rf -- "$GNUPGHOME"' EXIT
          printf '%s' "$HERDR_APT_SIGNING_KEY" | gpg --batch --import
          unset HERDR_APT_SIGNING_KEY
          fingerprint=$(sed -n 's/^Fingerprint: //p' apt/signing-key.txt)
          python3 -B scripts/build-apt-repo.py --packages build/apt-packages \
            --output build/site/apt --public-key apt/herdr-termux.gpg --key "$fingerprint"
          cp -f setup-repo.sh build/site/setup-repo.sh
          cp -f scripts/smoke-test.sh build/site/smoke-test.sh
          cp -f apt/signing-key.txt build/site/signing-key.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-apt-site
          path: build/site
          if-no-files-found: error
          retention-days: 14

  arm-runtime:
    needs: repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.repository.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-apt-site
          path: build/site
      - name: Native Termux installation and upgrade through signed APT
        run: |
          docker run --rm -i --security-opt seccomp=unconfined \
            --volume "$PWD/build/site:/site:ro" --volume "$PWD/scripts:/scripts:ro" \
            termux/termux-docker@sha256:df5f14a6adfc0713df0040b0fa885dd8e72d9455c95df8bc8453fefd970f89e4 \
            bash -l /scripts/test-apt-termux.sh candidate

  deploy:
    needs: [repository, arm-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-apt-site
          path: site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - name: Deploy authenticated repository
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  live-check:
    needs: [checks, deploy]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.checks.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-apt-site
          path: build/site
      - name: Verify public phone setup, installation, and upgrade
        run: |
          docker run --rm -i --security-opt seccomp=unconfined \
            --volume "$PWD/build/site:/site:ro" --volume "$PWD/scripts:/scripts:ro" \
            termux/termux-docker@sha256:df5f14a6adfc0713df0040b0fa885dd8e72d9455c95df8bc8453fefd970f89e4 \
            bash -l /scripts/test-apt-termux.sh live
