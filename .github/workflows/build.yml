name: Build Termux package

on:
  push:
    branches: [main]
    tags: ['v*-termux.*']
  pull_request:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Recheck native ARM runtime using artifacts from a previous build run (blank builds from source)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils curl git python3 xz-utils
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          rustup toolchain install 1.98.0 --profile minimal
          rustup component add --toolchain 1.98.0 rust-docs
      - name: Cache compiler and dependency artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo
            build/host-tests
            .cache/zig-*
          key: ${{ runner.os }}-herdr-ndk28-rust1.98-zig0.16-${{ hashFiles('patches/*.patch', 'scripts/build-android.sh') }}
          restore-keys: |
            ${{ runner.os }}-herdr-ndk28-rust1.98-zig0.16-
      - name: Check packaging and installer
        run: bash tests/test-packaging.sh
      - name: Build Android aarch64
        run: bash scripts/build-android.sh
      - name: Test client interactions
        run: |
          export ZIG="$PWD/.cache/zig-x86_64-linux-0.16.0/zig"
          export ZIG_GLOBAL_CACHE_DIR="$PWD/.cache/zig-global"
          export CARGO_TARGET_DIR="$PWD/build/host-tests"
          export CARGO_BUILD_JOBS=4
          cargo test --locked --manifest-path upstream/Cargo.toml --bin herdr client::shell::tests:: -- --test-threads=4
      - name: Collect dependency notices
        run: python3 scripts/collect-licenses.py --zig-cache .cache/zig-global
      - name: Package
        run: |
          bash scripts/package-deb.sh --binary dist/herdr --source-dir upstream --version 0.9.3-2 --output-dir dist --licenses-dir dist/licenses
          cp -f install.sh dist/install.sh
          cp -f scripts/smoke-test.sh dist/smoke-test.sh
          cd dist
          sha256sum herdr_0.9.3-2_aarch64.deb install.sh smoke-test.sh build-info.txt > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: herdr-termux-aarch64
          path: |
            dist/*.deb
            dist/install.sh
            dist/smoke-test.sh
            dist/SHA256SUMS
            dist/build-info.txt
          if-no-files-found: error

  arm-runtime:
    needs: android
    if: ${{ !cancelled() && (needs.android.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '')) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: herdr-termux-aarch64
          path: dist
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install and exercise package in native aarch64 Termux userland
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          cd ..
          docker run --rm -i --security-opt seccomp=unconfined \
            --volume "$PWD/dist:/artifacts:ro" \
            termux/termux-docker@sha256:df5f14a6adfc0713df0040b0fa885dd8e72d9455c95df8bc8453fefd970f89e4 \
            bash -ls <<'TERMUX_TEST'
          set -euo pipefail
          TERMUX_PKG_NO_MIRROR_SELECT=true pkg install -y /artifacts/herdr_0.9.3-2_aarch64.deb
          herdr-update --help
          # This Linux container has no Android property service. Supply only
          # the API level for the updater no-op check; architecture, dpkg, and
          # the installed executable are real native ARM Termux components.
          property_fixture=$(mktemp -d)
          trap 'rm -rf -- "$property_fixture"' EXIT
          cat > "$property_fixture/getprop" <<'GETPROP'
          #!/data/data/com.termux/files/usr/bin/sh
          [ "$1" = ro.build.version.sdk ] || exit 1
          printf '24\n'
          GETPROP
          chmod +x "$property_fixture/getprop"
          PATH="$property_fixture:$PATH" herdr-update --version v0.9.3-termux.2
          sh /artifacts/smoke-test.sh "$(command -v herdr)"
          TERMUX_TEST

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, arm-runtime]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download package and create draft for runtime validation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving its reviewed assets intact."
            exit 0
          fi
          gh run download "$RUN_ID" --name herdr-termux-aarch64 --dir dist
          gh release create "$RELEASE_TAG" dist/* --draft --verify-tag \
            --title "Herdr $RELEASE_TAG for Termux" \
            --notes 'Android aarch64 package. Draft pending Android/Termux runtime smoke testing; see docs/VALIDATION.md.'
